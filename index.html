body::after{content:"";position:fixed;inset:0;background:var(--bg);opacity:.6;pointer-events:none}
.top{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 14px}
#fb:not(:empty){background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px}
.center{text-align:center;margin-top:12vh}
h1{font-size:32px;line-height:1.15;margin:0 0 10px;font-weight:800}
h2{font-size:22px;line-height:1.3;margin:0;font-weight:800}
p{margin:0 0 22px;color:var(--muted)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;font:inherit;font-weight:800;font-size:17px;background:var(--accent);color:var(--accent-ink);cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.98)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.meta{display:flex;flex-direction:column;font-weight:700;font-size:14px;color:var(--muted)}
.meta b{color:var(--ink);font-size:16px}
.timer{position:relative;width:52px;height:52px}
.timer svg{width:52px;height:52px;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:5}
.timer .bg{stroke:var(--line)}
#ring{stroke:var(--ring);stroke-linecap:round;stroke-dasharray:138.2;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear}
#sec{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:17px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:17px;cursor:pointer;transition:transform .12s,border-color .12s}
.opt:active:not(:disabled){transform:scale(.985)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.ltr{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--bg);color:var(--accent);font-weight:800}
.opt.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt.good .ltr,.opt.bad .ltr{background:transparent;color:inherit}
#fb{min-height:26px;margin:14px 2px;font-weight:700}
#fb.good{color:var(--good)}
#fb.bad{color:var(--bad)}
#fb.hint{color:var(--muted)}

.bar2{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px}
.bar2 .tbtn{margin:0}
.tbtn{display:block;margin:0 0 12px auto;padding:8px 16px;border-radius:99px;border:2px solid var(--line);background:color-mix(in srgb,var(--card) 78%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--ink);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.big{font-size:64px;font-weight:800;line-height:1;color:var(--accent);margin-bottom:8px}
button:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.card,.opt,.top,#fb:not(:empty){background:color-mix(in srgb,var(--card) 78%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<main class="wrap">
<div class="bar2"><button class="tbtn" id="snd" type="button">Sound on</button><button class="tbtn" id="theme" type="button">Dark mode</button></div>
<section id="start" class="card center">
<h1>Quick quiz</h1>
<p>10 new questions every game, 15 seconds each. Answer fast and build a streak.</p>
<button class="btn" id="go" type="button">Start quiz</button>
</section>
<section id="quiz" hidden>
<div class="top">
<div class="meta"><b id="count"></b><span id="streak"></span></div>

const $=id=>document.getElementById(id);
let list,i,score,streak,best,left,timer,locked;
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function show(id){["start","quiz","end"].forEach(s=>{$(s).hidden=s!==id})}
async function start(ev){const gb=(ev&&ev.currentTarget)||$("go");if(busy)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}busy=true;const old=gb.textContent;gb.disabled=true;gb.textContent="Making new questions…";let fresh=null;try{fresh=await aiQs()}catch(e){}gb.disabled=false;gb.textContent=old;busy=false;src=fresh?"Claude":"Backup";list=fresh||fromBank(10);i=0;score=0;streak=0;best=0;show("quiz");load()}
function tick(){$("sec").textContent=left;$("ring").style.strokeDashoffset=138.2*(1-left/15)}
function load(){
locked=false;const x=list[i];
$("count").textContent="Question "+(i+1)+" of "+list.length+" · "+src;
$("streak").textContent="Streak: "+streak;
$("fill").style.width=(i/list.length*100)+"%";
$("q").textContent=x.q;$("fb").textContent="Choose an answer to continue.";$("fb").className="hint";$("next").hidden=true;
const box=$("opts");box.textContent="";
shuffle(x.o).forEach((txt,k)=>{
const b=document.createElement("button");b.type="button";b.className="opt";
const s=document.createElement("span");s.className="ltr";s.textContent="ABCD"[k];
const p=document.createElement("span");p.textContent=txt;
b.append(s,p);b.onclick=()=>pick(b,txt);box.append(b)});
clearInterval(timer);left=15;$("ring").style.transition="none";tick();
requestAnimationFrame(()=>{$("ring").style.transition=""});
timer=setInterval(()=>{left--;tick();if(left<=0)pick(null,null)},1000)}
function pick(b,txt){
if(locked)return;locked=true;clearInterval(timer);
const x=list[i],right=x.o[0],ok=txt===right,fb=$("fb");play(ok);
document.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(o.lastChild.textContent===right)o.classList.add("good")});
if(ok){score++;streak++;best=Math.max(best,streak);fb.textContent=["Correct!","Nice one!","Right on!"][Math.floor(Math.random()*3)];fb.className="good"}
else{streak=0;if(b)b.classList.add("bad");fb.textContent=(b?"Not quite.":"Time’s up.")+" The answer is "+right+".";fb.className="bad"}
$("streak").textContent="Streak: "+streak;
$("next").textContent=i===list.length-1?"See result":"Next question";$("next").hidden=false}
function finish(){
clearInterval(timer);show("end");const n=list.length;
$("score").textContent=score+"/"+n;
$("msg").textContent=score>=7?"Quiz master":score>=5?"Nice work":"Good start";
$("sub").textContent="Best streak: "+best+". Play again to beat your score."}
let busy=false,src="Backup";
let seen=new Set(),recent=[];try{seen=new Set(JSON.parse(localStorage.getItem("seen")||"[]"));recent=JSON.parse(localStorage.getItem("recentq")||"[]");if(!Array.isArray(recent))recent=[]}catch(e){seen=new Set();recent=[]}
function save(){try{localStorage.setItem("seen",JSON.stringify([...seen]));localStorage.setItem("recentq",JSON.stringify(recent.slice(-20)))}catch(e){}}
function fromBank(n){let pool=Q.filter(x=>!seen.has(x.q));if(pool.length<n){seen.clear();pool=Q.slice()}const out=shuffle(pool).slice(0,n);out.forEach(x=>seen.add(x.q));save();return out}
const TOPICS=["space","animals","world geography","Pakistan","the human body","food","sports","technology","history","music","movies","maths","inventions","nature","famous people","art","languages","cricket","oceans","festivals","science","transport","famous buildings","plants"];
async function aiQs(){
const s=window.claude&&await window.claude.use("sample");
if(!s)return null;
const t=shuffle(TOPICS).slice(0,10).join(", ");
const p='Write 10 easy multiple-choice quiz questions for a general audience, one question for each of these topics: '+t+'. Make every question fresh and different (seed '+Math.random().toString(36).slice(2,8)+'). Do not repeat or rephrase any of these earlier questions: '+(recent.slice(-20).join(" | ")||"none")+'. Reply with ONLY a JSON array, no other text, like [{"q":"question","o":["correct answer","wrong 1","wrong 2","wrong 3"]}]. The correct answer must always be first in o. Keep each option under 40 characters. Only use facts you are sure about.';
try{
const r=await Promise.race([s.json(p,{modelTier:"quick",cache:false}),new Promise((_,j)=>setTimeout(()=>j(0),30000))]);
const ok=(Array.isArray(r)?r:[]).filter(x=>x&&typeof x.q==="string"&&x.q.length<200&&Array.isArray(x.o)&&x.o.length===4&&x.o.every(v=>typeof v==="string"&&v.length>0&&v.length<=60)&&new Set(x.o).size===4);
if(ok.length<6)return null;
const out=ok.slice(0,10).map(x=>({q:x.q,o:x.o}));
out.forEach(x=>recent.push(x.q));save();return shuffle(out.concat(fromBank(10-out.length)));
}catch(e){return null}}
let ac=null,sndOn=true;
function tone(f,t0,d,type,v){const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(0.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.02);g.gain.exponentialRampToValueAtTime(0.0001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.05)}
function play(ok){if(!sndOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();if(ok){tone(660,0,.14,"sine",.25);tone(880,.12,.24,"sine",.25)}else{tone(220,0,.18,"square",.12);tone(160,.16,.3,"square",.12)}}catch(e){}}
$("snd").onclick=()=>{sndOn=!sndOn;$("snd").textContent=sndOn?"Sound on":"Sound off";if(sndOn)play(true)};
function setTheme(t){document.documentElement.dataset.theme=t;$("theme").textContent=t==="dark"?"Light mode":"Dark mode";try{localStorage.setItem("theme",t)}catch(e){}}
$("theme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
let saved=null;try{saved=localStorage.getItem("theme")}catch(e){}
setTheme(saved==="dark"?"dark":"light");
$("go").onclick=start;$("again").onclick=start;
$("next").onclick=()=>{if(!locked)return;i++;if(i>=list.length)finish();else load()};
